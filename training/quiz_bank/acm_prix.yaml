# Quiz — ACM & Objections prix
# Thèmes couverts : Présentation de l'ACM, Objections sur le prix,
#                   Mandat confiance au prix, Renégociation du prix
theme_tags:
  - "Présentation de l'ACM"
  - "Objections sur le prix"
  - "Mandat confiance au prix"
  - "Renégociation du prix"

questions:
  - question: "À quoi sert principalement l'ACM (Analyse Comparative de Marché) dans une discussion prix ?"
    choices:
      - "Prouver que l'agence a raison"
      - "Ancrer le prix sur des comparables du marché"
      - "Forcer le vendeur à signer"
      - "Éviter toute négociation"
    correct: 1
    explanation_rag_query: "À quoi sert l'ACM (Analyse Comparative de Marché) pour ancrer le prix avec le vendeur ?"
    difficulty: 1
    time_limit: 20

  - question: "Un vendeur dit 'mon voisin a vendu plus cher'. Quelle posture adoptez-vous ?"
    choices:
      - "Vous lui dites qu'il a tort"
      - "Vous revenez aux comparables de l'ACM avec des données factuelles"
      - "Vous baissez vos honoraires pour compenser"
      - "Vous acceptez son prix sans discuter"
    correct: 1
    explanation_rag_query: "Comment traiter l'objection du vendeur sur le prix du voisin ?"
    difficulty: 2
    time_limit: 25

  - question: "Avant de proposer une baisse de prix, que vérifiez-vous en priorité ?"
    choices:
      - "Que le vendeur est sympathique"
      - "Que toutes les actions de promotion ont été réalisées"
      - "Que le voisin est d'accord"
      - "Que l'acquéreur a un crédit"
    correct: 1
    explanation_rag_query: "Quelles actions mener avant de renégocier le prix ?"
    difficulty: 2
    time_limit: 25

  - question: "Dans une ACM (Analyse Comparative de Marché), quels sont les 3 types de biens à présenter ?"
    choices:
      - "Neufs, anciens, luxe"
      - "Vendus, à vendre, invendus"
      - "Studios, T3, maisons"
      - "Proches, loin, très loin"
    correct: 1
    explanation_rag_query: "Quels types de biens présenter dans une ACM : vendus, à vendre, invendus ?"
    difficulty: 1
    time_limit: 20

  - question: "Un vendeur estime son bien 20% au-dessus du marché. Que faites-vous ?"
    choices:
      - "Vous acceptez pour avoir le mandat"
      - "Vous présentez l'ACM et cadrez le prix avec des données du marché"
      - "Vous refusez le mandat"
      - "Vous promettez de vendre au prix du vendeur"
    correct: 1
    explanation_rag_query: "Comment utiliser l'ACM pour cadrer un vendeur qui surestime son bien ?"
    difficulty: 2
    time_limit: 25

  - question: "Le lien entre confiance et prix, c'est :"
    choices:
      - "Plus vous baissez le prix, plus le vendeur vous fait confiance"
      - "La confiance se construit par la méthode et les preuves avant de parler prix"
      - "Le prix n'a rien à voir avec la confiance"
      - "La confiance vient seulement après la vente"
    correct: 1
    explanation_rag_query: "Quel est le lien entre confiance et prix dans la prise de mandat ?"
    difficulty: 2
    time_limit: 30

  - question: "Quand un bien ne se vend pas, quelle est la première étape ?"
    choices:
      - "Baisser le prix immédiatement"
      - "Faire le bilan des actions de promotion et analyser les retours"
      - "Changer d'agence"
      - "Attendre que le marché remonte"
    correct: 1
    explanation_rag_query: "Quand un bien ne se vend pas, pourquoi faire le bilan des actions avant de baisser le prix ?"
    difficulty: 1
    time_limit: 20

  - question: "Une ACM (Analyse Comparative de Marché) mise à jour permet de :"
    choices:
      - "Prouver que vous aviez raison depuis le début"
      - "Objectiver l'évolution du marché et ajuster la stratégie"
      - "Mettre la pression sur le vendeur"
      - "Remplir le dossier administratif"
    correct: 1
    explanation_rag_query: "Pourquoi mettre à jour l'ACM pour objectiver l'évolution du marché ?"
    difficulty: 1
    time_limit: 20

  - question: "Le vendeur dit 'je ne baisse pas'. Votre premier réflexe ?"
    choices:
      - "Vous insistez sur la baisse"
      - "Vous écoutez ses raisons et revenez aux faits du marché"
      - "Vous abandonnez le mandat"
      - "Vous proposez un compromis à 50/50"
    correct: 1
    explanation_rag_query: "Comment traiter les objections sur le prix ?"
    difficulty: 2
    time_limit: 25

  - question: "En renégociation, quel argument a le plus de poids ?"
    choices:
      - "Les retours concrets des acquéreurs ayant visité"
      - "Votre opinion personnelle sur le marché"
      - "Ce que font les autres agences"
      - "Le nombre d'annonces en ligne"
    correct: 0
    explanation_rag_query: "Quels arguments utiliser pour renégocier un prix ?"
    difficulty: 3
    time_limit: 30
