# Quiz — Vente du service & Mandat
# Thèmes couverts : Vente du service post-ACM, Proposition de service,
#                   Prise de mandat exclusif, Préparation de visite,
#                   Compte-rendu de visite, Fidélisation et recommandation
theme_tags:
  - "Vente du service post-ACM"
  - "Proposition de service"
  - "Prise de mandat exclusif"
  - "Préparation de visite"
  - "Compte-rendu de visite"
  - "Fidélisation et recommandation"

questions:
  - question: "Un vendeur dit 'je veux comparer les agences'. Comment réagissez-vous ?"
    choices:
      - "Vous baissez vos honoraires"
      - "Vous vendez votre méthode et votre plan d'actions, pas votre marque"
      - "Vous dénigrez les concurrents"
      - "Vous acceptez et attendez qu'il revienne"
    correct: 1
    explanation_rag_query: "Comment vendre le service face à un vendeur qui compare les agences ?"
    difficulty: 2
    time_limit: 25

  - question: "Dans une proposition de service, qu'est-ce qui convainc le plus ?"
    choices:
      - "Des promesses vagues sur le délai de vente"
      - "Un plan d'actions clair avec un suivi structuré"
      - "Une réduction des honoraires"
      - "Un long discours sur l'agence"
    correct: 1
    explanation_rag_query: "Qu'est-ce qui convainc dans une proposition de service ?"
    difficulty: 1
    time_limit: 20

  - question: "Vous proposez un mandat exclusif et le vendeur hésite. Votre argument clé ?"
    choices:
      - "C'est obligatoire"
      - "L'exclusivité permet un plan d'actions complet et un suivi dédié"
      - "Les autres agences ne travaillent pas bien"
      - "Le prix sera plus élevé en exclusif"
    correct: 1
    explanation_rag_query: "Comment argumenter en faveur du mandat exclusif ?"
    difficulty: 2
    time_limit: 25

  - question: "Quel est le risque si vous parlez uniquement du prix sans mentionner le service ?"
    choices:
      - "Le vendeur achète plus vite"
      - "Vous vous mettez en concurrence directe sur le coût uniquement"
      - "Le mandat devient automatiquement exclusif"
      - "Vous gagnez du temps"
    correct: 1
    explanation_rag_query: "Quel risque si on parle uniquement du prix sans service ?"
    difficulty: 2
    time_limit: 25

  - question: "Comment relier le service aux priorités du vendeur ?"
    choices:
      - "En parlant de soi"
      - "En montrant que chaque action répond à un objectif du vendeur (prix, délai, tranquillité)"
      - "En listant toutes les prestations de l'agence"
      - "En présentant un tableau comparatif d'agences"
    correct: 1
    explanation_rag_query: "Comment relier le service aux priorités du vendeur ?"
    difficulty: 2
    time_limit: 25

  - question: "Avant une visite, que préparez-vous en priorité ?"
    choices:
      - "Un café pour l'acquéreur"
      - "Le parcours de visite, les arguments clés et les objections probables"
      - "Une estimation de prix mise à jour"
      - "Une plaquette commerciale"
    correct: 1
    explanation_rag_query: "Comment préparer une visite efficace ?"
    difficulty: 1
    time_limit: 20

  - question: "Un bon compte-rendu de visite sert à :"
    choices:
      - "Prouver que vous avez fait des visites"
      - "Donner un retour utile au vendeur et structurer la suite"
      - "Remplir le logiciel de l'agence"
      - "Comparer les acquéreurs entre eux"
    correct: 1
    explanation_rag_query: "À quoi sert un bon compte-rendu de visite ?"
    difficulty: 1
    time_limit: 20

  - question: "Comment transformer un vendeur satisfait en source de recommandation ?"
    choices:
      - "En lui envoyant un cadeau"
      - "En gardant le contact et en demandant une recommandation au bon moment"
      - "En publiant son avis sans lui demander"
      - "En baissant les honoraires pour les prochains"
    correct: 1
    explanation_rag_query: "Comment fidéliser un vendeur et générer des recommandations ?"
    difficulty: 2
    time_limit: 25

  - question: "Le vendeur dit 'je veux juste que vous mettiez l'annonce'. Votre réponse ?"
    choices:
      - "Vous mettez l'annonce et attendez"
      - "Vous expliquez que le service inclut méthode, suivi et accompagnement, pas juste l'annonce"
      - "Vous refusez le mandat"
      - "Vous mettez l'annonce et appelez dans un mois"
    correct: 1
    explanation_rag_query: "Comment cadrer une proposition de service ?"
    difficulty: 2
    time_limit: 25

  - question: "En fin d'entretien, comment conclure efficacement ?"
    choices:
      - "Vous donnez votre carte et partez"
      - "Vous validez les prochaines étapes avec un engagement clair"
      - "Vous dites 'on se rappelle'"
      - "Vous demandez au vendeur de réfléchir"
    correct: 1
    explanation_rag_query: "Comment conclure une proposition de service ?"
    difficulty: 2
    time_limit: 25
