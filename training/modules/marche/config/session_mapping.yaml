## CONFIGURATION PYTHON

```python
# training/modules/marche/config/session_mapping.py

MARCHE_SESSIONS_MAPPING = {
    1: [1, 2],    # Marché mondial
    2: [3, 4],    # Cycles & Géopolitique
    3: [5, 6],    # Marché France
    4: [7, 8],    # Loi Climat
    5: [9, 10],   # Réglementations
    6: [11, 12],  # Urbanisme
    7: [13, 14],  # Fiscalité
    8: [15, 16],  # Défiscalisation
    9: [17, 18],  # Crédit
    10: [19, 20], # Garanties
    # ... jusqu'à 50
    
    # Révisions
    51: [1, 3, 4],
    52: [7, 8, 42, 53],
    # ...
}

def get_marche_modules_for_session(session_num: int) -> List[int]:
    """Retourne les IDs modules marché pour une session donnée"""
    return MARCHE_SESSIONS_MAPPING.get(session_num, [])
```

